# Campus Placement — PRODUCTION stack (full self-host)
# Frontend (nginx) + backend + Piston + Judge0 + ClamAV. NO MongoDB/Redis
# images — the app connects to MongoDB Atlas and Upstash Redis via the
# .env.production file.
#
# Usage:
#   cp .env.production.example .env.production   # fill in real values
#   cp judge0.conf.example judge0.conf           # judge0 needs its config
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Notes:
#  - VITE_API_URL is baked into the frontend bundle at BUILD time — it must
#    be the PUBLIC backend URL the browser can reach (e.g. https://api.your
#    -domain.com), and FRONTEND_URL/CORS_ORIGIN must match the frontend origin.
#  - Atlas connection strings include a query string (?retryWrites=true&w=
#    majority) — the backend now appends DB_NAME safely in that case.
#  - Upstash Redis: rediss:// URLs are handled natively by ioredis (TLS).
#  - Piston AND Judge0 both run; the backend tries them in order
#    (CODE_EXECUTION_ENGINES) and fails over automatically.
#  - ClamAV scans uploads (fail-closed by default); remove the service (and
#    set CLAMAV_HOST=) only if you intentionally disable scanning.
#  - Piston/Judge0 can be dropped if you use hosted alternatives — just set
#    PISTON_API_URL / JUDGE0_API_URL and remove their services.

name: campusplace-prod

services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: campusplace-prod-piston
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PISTON_PORT:-2000}:2000"
    volumes:
      - piston_packages:/piston/packages
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: campusplace-prod-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-6005}:6005"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PISTON_API_URL: http://piston:2000/api/v2/piston/execute
      JUDGE0_API_URL: http://judge0:2358
      CODE_EXECUTION_ENGINES: ${CODE_EXECUTION_ENGINES:-self_piston,judge0,public_piston,community_piston}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_FAIL_OPEN: ${CLAMAV_FAIL_OPEN:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    depends_on:
      piston:
        condition: service_healthy
      judge0:
        condition: service_started
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6005/api/v1/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../Frontend-Campus-Placement-Portal-
      args:
        # Must be reachable from the BROWSER — set in .env.production
        VITE_API_URL: ${VITE_API_URL:-http://localhost:6005}
    container_name: campusplace-prod-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ---- Judge0 — second code-execution engine ----
  judge0:
    image: judge0/judge0:latest
    container_name: campusplace-prod-judge0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:${JUDGE0_PORT:-2358}:2358"
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-worker:
    image: judge0/judge0:latest
    container_name: campusplace-prod-judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-db:
    image: postgres:16.2
    container_name: campusplace-prod-judge0-db
    env_file: judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  judge0-redis:
    image: redis:7.2.4
    container_name: campusplace-prod-judge0-redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- ClamAV — virus scanning for uploads ----
  clamav:
    image: clamav/clamav:stable
    container_name: campusplace-prod-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  piston_packages:
  judge0_data:
  clamav_db:

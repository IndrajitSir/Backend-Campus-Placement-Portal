# Campus Placement — Backend stack (LOCAL DEVELOPMENT)
# Deployed separately from the frontend (frontend runs via `npm run dev`
# on the host, pointing at http://localhost:6005).
#
# A single `docker compose up --build` brings up the API plus Mongo / Redis /
# Piston / Judge0 / ClamAV services, with the backend hot-reloading from
# ./src (nodemon inside the container).
#
# Judge0 needs its config file on first run:
#   cp judge0.conf.example judge0.conf
#
# ClamAV downloads its virus database on first start (a few minutes); uploads
# are rejected (fail-closed) until clamd is healthy.
#
# Note: if a MongoDB / Redis instance is already running on the host
# (e.g. the Windows "MongoDB" service on 27017), override the host ports:
#   MONGO_PORT=27018 REDIS_PORT=6380 docker compose up -d --build

name: campusplace-backend

services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: campusplace-piston
    restart: unless-stopped
    ports:
      - "${PISTON_PORT:-2000}:2000"
    volumes:
      - piston_packages:/piston/packages
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7
    container_name: campusplace-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: campusplace-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusplace-backend
    restart: unless-stopped
    command: npm run dev
    ports:
      - "${BACKEND_PORT:-6005}:6005"
    volumes:
      # Live source hot-reload (deps come from the image layer)
      - ./src:/app/src
    environment:
      # Keep NODE_ENV=development so auth cookies are NOT marked Secure —
      # Secure cookies are dropped by browsers over plain http.
      # (See src/constants.js — secure: NODE_ENV === "production")
      NODE_ENV: development
      PORT: 6005
      # Always the bundled MongoDB container. Don't reuse the dev .env's
      # MONGODB_URI here (localhost would point at the container itself).
      # To use an external DB (Atlas / host), edit this line directly or
      # pass it with a dedicated env: docker compose run -e MONGODB_URI=...
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: ${DB_NAME:-campusplace}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-change-me-in-production}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-1d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-me-in-production}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      # Optional integrations — leave blank to run core features
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      LOGTAIL_SOURCE_TOKEN: ${LOGTAIL_SOURCE_TOKEN:-}
      PISTON_API_URL: http://piston:2000/api/v2/piston/execute
      # Code-execution failover order + Judge0 engine
      JUDGE0_API_URL: http://judge0:2358
      CODE_EXECUTION_ENGINES: ${CODE_EXECUTION_ENGINES:-self_piston,judge0,public_piston,community_piston}
      # File scanning (ClamAV) — fail-closed by default
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_FAIL_OPEN: ${CLAMAV_FAIL_OPEN:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      piston:
        condition: service_healthy
      judge0:
        condition: service_started
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6005/api/v1/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Judge0 — second code-execution engine (runs by default) ----
  # Piston and Judge0 co-exist; the backend tries them in order and fails
  # over automatically (CODE_EXECUTION_ENGINES). Requires judge0.conf:
  #   cp judge0.conf.example judge0.conf
  judge0:
    image: judge0/judge0:latest
    container_name: campusplace-judge0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "${JUDGE0_PORT:-2358}:2358"
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-worker:
    image: judge0/judge0:latest
    container_name: campusplace-judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-db:
    image: postgres:16.2
    container_name: campusplace-judge0-db
    env_file: judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  judge0-redis:
    image: redis:7.2.4
    container_name: campusplace-judge0-redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    container_name: campusplace-clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mongo_data:
  redis_data:
  piston_packages:
  judge0_data:
  clamav_db:
